<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sign Up Form -->
  <div id="signup-container">
    <h2>Sign Up</h2>
    <input type="text" id="signup-username" placeholder="Username">
    <input type="password" id="signup-password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <p id="signup-error"></p>
    <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
  </div>

  <!-- Login Form -->
  <div id="login-container" style="display:none;">
    <h2>Login</h2>
    <input type="text" id="login-username" placeholder="Username">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="login-error"></p>
    <p>Don’t have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <div class="sidebar" id="sidebar">
      <h3>Menu</h3>
      <ul>
        <li><a href="#" onclick="showSection('inventory')">Inventory</a></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
      </ul>
      <h3>Users</h3>
      <ul id="userList"></ul>
    </div>
    <div class="main">
      <h2>Inventory Dashboard</h2>
      <div id="inventory-section">
        <input type="text" id="itemName" placeholder="Item Name">
        <input type="number" id="itemQty" placeholder="Quantity">
        <input type="text" id="itemCategory" placeholder="Category">
        <input type="number" id="itemPrice" placeholder="Price">
        <input type="text" id="itemSupplier" placeholder="Supplier">
        <button onclick="addItem()">Add Item</button>
        <table id="inventoryTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Item</th>
              <th>Category</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Supplier</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
